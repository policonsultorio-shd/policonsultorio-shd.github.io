<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorios SHD Infinite</title>

    <!--fuentes de texto-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">


    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2563EB;
            color: #f3f3f3;
        }

        .hero{
            font-family: 'Poppins', sans-serif;

            background:
             linear-gradient(rgba(16,72,138,.65), rgba(16,72,138,.65)),
             url("img/imagen-web.jpeg");

             background-size: cover;
             background-position: center;
                background-attachment: fixed;
                color: white;
            min-height: 70vh;

            display: flex;
             flex-direction: column;

             justify-content: center; /* Centra verticalmente */
             align-items: center;     /* Centra horizontalmente */

            text-align: center;

        }

        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        ul{
            color: #35342b
        }

        /*h1 para titulos*/
        h1 {
            text-align: center;
            color: #f2f2f2;
            text-shadow: 2px 2px 12px rgba(0,0,0,.45);
        }


        /*h2 para subtitulos*/
        h2 {
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: 10px;
            margin-right: 10px;
            color: #444;
        }
        
        /*h3 para texto normal*/
        h3 {
            margin-top: 10px;
    
            color: #000000;
        }



        /*tarjetas*/
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            z-index: 1;
            margin-top: 15px;
            min-width: 400px;
        }

        /*ul y li son para listas*/
        ul {
            padding-left: 20px;
        }



        /*Boton*/
        .btn {
            display: block;
            text-align: center;
            background-color: #25D366;
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #1ebe5d;
        }


        /*p para texto normal*/

        p{
            color:#35342b
        }

        .logo{
            width: 120px;
            height: auto;
            margin: 0 auto;
            margin-top: 10px;
            margin-bottom: 20px;
        }


    </style>
</head>
